[project]
name = "latent-port"
version = "0.2.0"
description = "A lab for communication through frozen-model latent interfaces: capacity, cross-model bridges, wiretaps, and legibility."
requires-python = ">=3.10"
dependencies = [
  "datasets>=2.19",
  "fastapi>=0.110",
  "matplotlib>=3.8",
  "numpy>=1.24",
  "pillow>=10",
  "torch>=2.2",
  "transformers>=4.57",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
visual-channel-web = "visual_encoder.web:main"
visual-channel-probe = "visual_encoder.qwen_probe:main"
latent-port-demo = "visual_encoder.psychic_demo:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
